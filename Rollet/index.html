<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>개발중</title>

<style>
body {
  margin: 0;
  background: #000;
  color: white;
  font-family: Arial;
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
}

/* 박스 */
.container {
  text-align: center;
  animation: fadeIn 1s ease;
}

/* 큰 제목 */
h1 {
  font-size: 32px;
  margin-bottom: 10px;
}

/* 서브 */
p {
  opacity: 0.7;
}

/* 점 애니메이션 */
.dots::after {
  content: "";
  animation: dots 1.5s infinite;
}

/* 애니메이션 */
@keyframes dots {
  0% { content: ""; }
  33% { content: "."; }
  66% { content: ".."; }
  100% { content: "..."; }
}

@keyframes fadeIn {
  from {
    opacity: 0;
    transform: translateY(20px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

/* 버튼 */
.btn {
  margin-top: 20px;
  display: inline-block;
  padding: 10px 20px;
  background: #222;
  color: white;
  text-decoration: none;
  border-radius: 8px;
}

.btn:hover {
  background: #333;
}
</style>

</head>

<body>

<div class="container">

  <h1>🚧 현재 개발중입니다<span class="dots"></span></h1>

  <p>기능을 준비하고 있어요. 잠시만 기다려주세요!(개발자가 더 빨리빨리 일하겠습니다ㅠㅠ)</p>

  <a class="btn" href="https://kevinlee0708.github.io/Open-Chat-SpaceAndFlight/">🏠 홈으로 돌아가기</a>

</div>

</body>
</html>
