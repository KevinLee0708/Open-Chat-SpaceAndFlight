<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>오락 사이트</title>

<link rel="stylesheet" href="style.css">
</head>

<body>

<!-- ===== NAV ===== -->
<header class="navbar">
  <div class="logo">🎮 HOME</div>

  <nav class="menu">
    <a href="https://kevinlee0708.github.io/Open-Chat-SpaceAndFlight/">홈</a>
    <a href="roulette.html">룰렛 서비스</a>
    <a href="https://kevinlee0708.github.io/Open-Chat-SpaceAndFlight/penalty/">멸망 벌칙 리스트</a>
  </nav>
</header>

<!-- ===== HOME CONTENT ===== -->
<div class="home-container">

  <h1 class="scroll-item">항공 우주 수다방의의 오락 사이트입니다</h1>

  <p class="sub scroll-item">
    간단한 게임과 기능을 모아둔 개인 오락 플랫폼입니다
  </p>

  <div class="button-box scroll-item">

    <a class="btn" href="roulette.html">🎰 룰렛 돌리기</a>

    <a class="btn danger" href="dday.html">⏳ 멸망 벌칙 리스트 보기</a>

  </div>

</div>

<!-- ===== JS ===== -->
<script>
function scrollAnimation() {
  const items = document.querySelectorAll(".scroll-item");

  items.forEach(el => {
    const rect = el.getBoundingClientRect();

    if (rect.top < window.innerHeight - 100) {
      el.classList.add("show");
    }
  });
}

window.addEventListener("scroll", scrollAnimation);
window.addEventListener("load", scrollAnimation);
</script>

</body>
</html>
